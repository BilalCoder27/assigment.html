<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>facebook login page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,
wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="facebook.css">
</head>
<body>
    <div class="container">
        <!-- left box -->
        <div id="left-box">
            
                <img src="download.png" alt="" id="fb-logo">
        
            
            <h1>Explore the things <span>you love</span>.
            </h1>
            <div>
                <img src="fb-img.webp" alt="" height="200px" width="200px">

            </div>
            

        </div>

        <!-- rigth box -->
        <div id="rigth-box">
            <h2>Log in to Facebook</h2>
            <!-- form area -->
            <form id="iput-boxes">
                <div id="email">
<input type="email" placeholder="email address or mobile number" required>
                </div>
            <div id="password">
                <input type="password" placeholder="password" required>

            </div>
            <div id="login-botton">
                <button> log in</button>

            </div>
             <div id="forget-botton">
                <button> forget password?</button>

            </div>
             <div id="singup-botton">
                <button>creative a new account</button>

            </div>
            <div id="meta-logo">
                <img src="meta.png" alt="" >meta
            

            </div>

            </form>
            
        </div>

    </div>
</body>
</html>
