<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>orderedlist and unorderedlist</title>
</head>
<body>
    <h1>ordered list</h1>
    <ol>
        <li>apple</li>
        <li>banana</li>
        <li>watermelon</li>
        <li>mango</li>
        <li>grape</li>
        <li>orange</li>
        <li>papaya</li>
        <li>pineapple</li>
    </ol>
    <h1>unordered list</h1>
    <ul>
        <li>loin
            <ul>
                <li>baby loin</li>
            </ul>
        </li>
    </ul>
    <ul>
        <li>monkey
            <ul>
                <li>smallmonkey</li>
            </ul>
        </li>
    </ul>
    <ul>
        <li>cow
            <ul>
                <li>female cow</li>
            </ul>
        </li>
    </ul>
    <ul>
        <li>camel
            <ul>
                <li>baby camel</li>
            </ul>
        </li>
    </ul>
    <ul>
        <li>goat
            <ul>
                <li>brown goat</li>
            </ul>
        </li>
    </ul>
    <ul>
        <li>dog
            <ul>
                <li>femaledog</li>
            </ul>
        </li>
    </ul>
</body>
</html>
